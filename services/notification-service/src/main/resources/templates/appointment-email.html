<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
<div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <div style="background-color: #009688; color: #ffffff; padding: 20px; text-align: center;">
        <h2 style="margin: 0;" th:text="${title}">Thông Báo Lịch Hẹn</h2>
    </div>
    <div style="padding: 30px; color: #333333; line-height: 1.6;">
        <p>Xin chào <strong th:text="${recipientName}">Tên Người Nhận</strong>,</p>
        <p th:text="${message}">Chi tiết thông báo.</p>

        <div style="background-color: #f0fdfa; border-left: 4px solid #009688; padding: 15px; margin: 20px 0;">
            <p style="margin: 5px 0;"><strong>Bệnh nhân:</strong> <span th:text="${patientName}">Nguyễn Văn A</span></p>
            <p style="margin: 5px 0;"><strong>Bác sĩ:</strong> <span th:text="${doctorName}">BS. Trần B</span></p>
            <p style="margin: 5px 0;"><strong>Thời gian:</strong> <span th:text="${appointmentTime}" style="color: #d32f2f; font-weight: bold;">08:30 - 25/10/2026</span></p>
            <p style="margin: 5px 0;"><strong>Bệnh viện:</strong> <span th:text="${hospitalName}">Bệnh viện X</span> - <span th:text="${departmentName}">Khoa Y</span></p>
            <p style="margin: 5px 0;"><strong>Lý do khám:</strong> <span th:text="${reason}">Đau đầu</span></p>
        </div>
    </div>
</div>
</body>
</html>
